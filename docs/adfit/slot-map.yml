slots:
  - route: "/* calculator routes after calculation"
    page_group: "calculator"
    placement: "result_primary"
    device: "mobile"
    ad_size: "320x480 preferred, 300x250 fallback"
    env_name: "NEXT_PUBLIC_ADFIT_MOBILE_RECTANGLE_IMAGE, NEXT_PUBLIC_ADFIT_MOBILE_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "result exists, viewport is mobile, feature flag is on, at least one env value exists"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_RESULT_PRIMARY"
    current_order: "calculator form -> result -> result_primary ad -> lower calculator content"

  - route: "/* calculator routes after calculation"
    page_group: "calculator"
    placement: "result_primary"
    device: "desktop"
    ad_size: "728x90"
    env_name: "NEXT_PUBLIC_ADFIT_DESKTOP_WEB_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "result exists, viewport is desktop, feature flag is on, env value exists"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_RESULT_PRIMARY"
    current_order: "calculator form -> result -> result_primary ad -> lower calculator content"

  - route: "/calculators, /guides, /guides/*"
    page_group: "index_or_guide"
    placement: "mid_content"
    device: "mobile"
    ad_size: "320x50"
    env_name: "NEXT_PUBLIC_ADFIT_MOBILE_THIN_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "viewport is mobile, feature flag is on, env value exists, content intro or guide policy section has completed"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_MID_CONTENT"
    current_order: "intro or first content block -> mid_content ad -> content list or article body"

  - route: "/calculators, /guides, /guides/*"
    page_group: "index_or_guide"
    placement: "mid_content"
    device: "desktop"
    ad_size: "728x90"
    env_name: "NEXT_PUBLIC_ADFIT_DESKTOP_WEB_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "viewport is desktop, feature flag is on, env value exists, content intro or guide policy section has completed"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_MID_CONTENT"
    current_order: "intro or first content block -> mid_content ad -> content list or article body"

  - route: "/calculators, /guides, /guides/*"
    page_group: "index_or_guide"
    placement: "desktop_rail"
    device: "desktop"
    ad_size: "160x600"
    env_name: "NEXT_PUBLIC_ADFIT_DESKTOP_RIGHT_TOP"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "viewport is at least 1536px wide, feature flag is on, env value exists"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_DESKTOP_RAIL"
    current_order: "side rail beside content, not sticky or fixed"

  - route: "/privacy-policy, /terms, /disclaimer"
    page_group: "legal"
    placement: "end"
    device: "mobile"
    ad_size: "320x50"
    env_name: "NEXT_PUBLIC_ADFIT_MOBILE_THIN_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "legal content has completed, viewport is mobile, feature flag is on, env value exists"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_END"
    current_order: "legal content -> end ad"

  - route: "/privacy-policy, /terms, /disclaimer"
    page_group: "legal"
    placement: "end"
    device: "desktop"
    ad_size: "728x90"
    env_name: "NEXT_PUBLIC_ADFIT_DESKTOP_WEB_BANNER"
    dan_id_present: "render-env-required"
    component: "src/components/adfit/AdFitSlot.tsx"
    sdk_loader: "AdFitSlot loadAdFitSdk"
    render_condition: "legal content has completed, viewport is desktop, feature flag is on, env value exists"
    feature_flag: "NEXT_PUBLIC_ADFIT_ENABLE_END"
    current_order: "legal content -> end ad"
