services:
  - type: web
    name: home-money-calculator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jipcalc.co.kr
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PUBLIC_ADFIT_HOME_MOBILE
        sync: false
      - key: PUBLIC_ADFIT_HOME_DESKTOP
        sync: false
      - key: PUBLIC_ADFIT_GUIDE_MOBILE
        sync: false
      - key: PUBLIC_ADFIT_GUIDE_DESKTOP
        sync: false
      - key: PUBLIC_ADFIT_CALC_ARTICLE_MOBILE
        sync: false
      - key: PUBLIC_ADFIT_CALC_ARTICLE_DESKTOP
        sync: false
      - key: PUBLIC_ADFIT_CALC_POST_TOOL_MOBILE
        sync: false
      - key: PUBLIC_ADFIT_CALC_POST_TOOL_DESKTOP
        sync: false
