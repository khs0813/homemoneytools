services:
  - type: web
    name: home-money-calculator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jipcalc.co.kr
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_ADFIT_MOBILE_RECTANGLE_IMAGE
        sync: false
      - key: NEXT_PUBLIC_ADFIT_MOBILE_THIN_BANNER
        sync: false
      - key: NEXT_PUBLIC_ADFIT_DESKTOP_RIGHT_TOP
        sync: false
      - key: NEXT_PUBLIC_ADFIT_MOBILE_BANNER
        sync: false
      - key: NEXT_PUBLIC_ADFIT_DESKTOP_WEB_BANNER
        sync: false
