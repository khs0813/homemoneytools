services:
  - type: web
    name: home-money-calculator
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    routes:
      - type: redirect
        source: /severance-pay-calculator
        destination: https://www.moneycalculator.co.kr/severance-pay-calculator
      - type: redirect
        source: /guides/acquisition-tax
        destination: /guides/acquisition-tax-checklist
      - type: redirect
        source: /guides/brokerage-fee
        destination: /guides/brokerage-fee-negotiation
      - type: redirect
        source: /guides/dsr
        destination: /guides/what-dsr-40-means
      - type: redirect
        source: /guides/jeonse-loan-interest
        destination: /guides/jeonse-loan-interest-mistakes
      - type: redirect
        source: /guides/monthly-rent-conversion
        destination: /guides/monthly-rent-conversion-basics
      - type: redirect
        source: /guides/rent-vs-jeonse
        destination: /guides/rent-vs-jeonse-decision-guide
      - type: redirect
        source: /guides/subscription-score
        destination: /guides/subscription-score-interpretation
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jipcalc.co.kr
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_ADFIT_MOBILE_RECTANGLE_IMAGE
        sync: false
      - key: NEXT_PUBLIC_ADFIT_MOBILE_THIN_BANNER
        sync: false
      - key: NEXT_PUBLIC_ADFIT_DESKTOP_RIGHT_TOP
        sync: false
      - key: NEXT_PUBLIC_ADFIT_MOBILE_BANNER
        sync: false
      - key: NEXT_PUBLIC_ADFIT_DESKTOP_WEB_BANNER
        sync: false
